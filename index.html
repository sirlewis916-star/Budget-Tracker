<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - My Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>My Budget Tracker</h1>
       <p>Track your income and expenses in one place.</p>

    <section id="add-expense">
        <h2>Add Expense</h2>
        <input type="text" id="expenseName" placeholder="Expense name (e.g. Groceries)">
        <input type="number" id="expenseAmount" placeholder="Amount (e.g. 500)">
        <input type="text" id="expenseCategory" placeholder="Category (e.g. Food)">
        <button>Add Expense</button>
    </section>

    <section class="expenses-section">
        <h2>Your Expenses</h2>
        <p>No expenses yet</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
